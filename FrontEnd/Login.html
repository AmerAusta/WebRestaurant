<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restorant - Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/Login&Register.css">
</head>

<body class="resto-auth-body">

  <div class="resto-auth-box text-center">
    <h2 class="mb-4">Welcome Back</h2>
    <form id="resto-auth-login-form">
      <div class="mb-3">
        <input type="email" id="resto-auth-email" class="form-control" placeholder="Email" required>
      </div>
      <div class="mb-3">
        <input type="password" id="resto-auth-password" class="form-control" placeholder="Password" required>
      </div>
      <button type="submit" class="btn resto-auth-btn w-100 py-2">Login</button>
      <p class="mt-3">Don't have an account? <a href="register.html">Register</a></p>
    </form>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/Login&Register.js"></script>
</body>

</html>
