<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8" />
  <title>Customer Bookings</title>
  <link rel="stylesheet" href="assets/css/ViewBookings.css">
</head>

<body>
  <div class="Bookin">
    <div class="container">
      <header class="header-row">
        <h1>Customer Bookings</h1>
        <div>
          <button id="refreshBtn" class="small-btn">🔄 Refresh</button>
          <a id="backBtn" class="link-btn" href="index.html">⬅ Back</a>
        </div>
      </header>

      <div id="info" class="info"></div>

      <table id="bookingTable" class="nice-table">
        <thead>
          <tr>
            <th>Booking ID</th>
            <th>Table</th>
            <th>Reservation Date / Time</th>
            <th>Remaining Time</th>
            <th>Status</th>
            <th>Notes</th>
            <th>Created At</th>
            <th>Action</th>
            <th>Order</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <p id="noData" class="no-data">No bookings found for this customer</p>
    </div>
  </div>  
  <script src="assets/js/config.js"></script>
  <script src="assets/js/ViewBookings.js"></script>
</body>

</html>
